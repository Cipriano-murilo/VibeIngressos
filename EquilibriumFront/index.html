<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Segurança: restringe de onde recursos podem ser carregados (CSP) -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' http://localhost:5017; frame-ancestors 'none';" />
  <!-- Impede que o browser adivinhe o MIME type do recurso -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <!-- Controla quais informações são enviadas no cabeçalho Referer -->
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description"
    content="VibeIngressos — A plataforma definitiva para compra de ingressos. Shows, festivais, teatro, esportes e muito mais." />
  <meta name="keywords" content="ingressos, shows, eventos, festas, teatro, bilheteria online" />
  <meta property="og:title" content="VibeIngressos — Sua Bilheteria Digital" />
  <meta property="og:description" content="Compre ingressos para os melhores eventos com segurança e facilidade." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap"
    rel="stylesheet" />
  <title>VibeIngressos — Sua Bilheteria Digital</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
